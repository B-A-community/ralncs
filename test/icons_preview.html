<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>icons</title>

  body { background: #e8e8e6; font-family: sans-serif; padding: 20px; display: flex; gap: 40px; }

  img.xl { width: 96px; height: 96px; }

</style></head>
<body>
  <div class="box"><img class="xl" src="../src/ralncs/icons/fan.svg"><div>fan</div>
    <div class="row"><img class="s" src="../src/ralncs/icons/fan.svg"><img class="s" src="../src/ralncs/icons/audit.svg"></div>
  </div>
  <div class="box"><img class="xl" src="../src/ralncs/icons/audit.svg"><div>audit</div>
    <div class="row"><img class="l" src="../src/ralncs/icons/fan.svg"><img class="l" src="../src/ralncs/icons/audit.svg"></div>
  </div>
</body></html>
