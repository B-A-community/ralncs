<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>О плагине RALNCS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    color: #1c1c1c; background: #f5f5f4;
    display: flex; flex-direction: column; height: 100vh;
  }
  main { flex: 1; padding: 18px 20px 12px; display: flex; gap: 16px; align-items: flex-start; }
  .logo { width: 56px; height: 56px; flex: none; }
  h1 { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .ver { color: #888; font-size: 11px; margin-top: 2px; }
  p { margin-top: 10px; }
  .authors { margin-top: 12px; }
  .authors b { display: block; color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; font-weight: 600; margin-bottom: 3px; }
  a { color: #2b6cb0; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .repo { margin-top: 12px; display: flex; align-items: center; gap: 6px; }
  .repo svg { width: 16px; height: 16px; flex: none; }
  footer {
    padding: 10px 20px; background: #fff; border-top: 1px solid #ddd;
    display: flex; align-items: center; gap: 10px;
  }
  footer .lic { color: #888; font-size: 11px; flex: 1; }
  button {
    font: inherit; padding: 6px 14px; border: 1px solid #bbb; border-radius: 6px;
    background: #fff; cursor: pointer;
  }
  button:hover { background: #f0f0ef; }
</style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <g transform="rotate(-54 12 19.5)"><rect x="9.8" y="4" width="4.4" height="15" rx="1.8" fill="#C1121F"/></g>
      <g transform="rotate(-18 12 19.5)"><rect x="9.8" y="4" width="4.4" height="15" rx="1.8" fill="#F2A900"/></g>
      <g transform="rotate(18 12 19.5)"><rect x="9.8" y="4" width="4.4" height="15" rx="1.8" fill="#2F855A"/></g>
      <g transform="rotate(54 12 19.5)"><rect x="9.8" y="4" width="4.4" height="15" rx="1.8" fill="#2B6CB0"/></g>
      <circle cx="12" cy="19.5" r="2.6" fill="#3B3B38"/><circle cx="12" cy="19.5" r="1.1" fill="#F5F5F4"/>
    </svg>
    <div>
      <h1>RALNCS</h1>
      <div class="ver" id="ver"></div>
      <p>Веер RAL Classic и NCS 1950, подбор ближайших RAL/NCS для материалов модели и ТЗ в один клик.</p>
      <div class="authors">
        <b>Авторы</b>
        Ruslan Tkachenko и Maksar Sanjeev
      </div>
      <div class="repo">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path fill="#3B3B38" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <a href="#" id="repo">github.com/B-A-community/ralncs</a>
      </div>
    </div>
  </main>
  <footer>
    <span class="lic">Apache 2.0 · B&amp;A community</span>
    <button id="btnClose">Закрыть</button>
  </footer>
<script>window.sketchup={ready:function(){init({version:"0.4.0"})},open_url:function(u){window.OPENED=u},close:function(){window.CLOSED=true}};</script>
<script>
  var REPO = 'https://github.com/B-A-community/ralncs';
  function init(d) { document.getElementById('ver').textContent = d.version ? 'версия ' + d.version : ''; }
  document.getElementById('repo').addEventListener('click', function (e) { e.preventDefault(); sketchup.open_url(REPO); });
  document.getElementById('btnClose').addEventListener('click', function () { sketchup.close(); });
  window.addEventListener('DOMContentLoaded', function () { sketchup.ready(); });
</script>
</body>
</html>
