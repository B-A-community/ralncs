<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title data-t="audit_title">RALNCS — анализ материалов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    color: #1c1c1c; background: #f5f5f4;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 14px; background: #fff; border-bottom: 1px solid #ddd;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: relative;
  }
  header .spacer { flex: 1; }
  button {
    font: inherit; padding: 6px 12px; border: 1px solid #bbb; border-radius: 6px;
    background: #fff; cursor: pointer;
  }
  button:hover { background: #f0f0ef; }
  button.primary { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
  button.primary:hover { background: #245a94; }
  button.on { background: #ececea; }
  label.opt { display: flex; align-items: center; gap: 5px; user-select: none; }
  #status { padding: 6px 14px; color: #666; }
  #wrap { flex: 1; overflow: auto; padding: 0 14px 14px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
  th { position: sticky; background: #fafaf9; z-index: 1; }
  thead tr.grp th {
    top: 0; height: 24px; padding: 0 8px; font-size: 11px; font-weight: 600;
    color: #888; text-transform: uppercase; letter-spacing: .03em;
    border-bottom: 1px solid #eee;
  }
  thead tr.grp th.g-ral, thead tr.grp th.g-ncs { border-left: 1px solid #e4e4e2; }
  thead tr.col th { top: 24px; border-bottom: 1px solid #ddd; }
  td.b-ral, td.b-ncs, thead tr.col th.b-ral, thead tr.col th.b-ncs { border-left: 1px solid #f0f0ee; }
  td.matname { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .sw {
    display: inline-block; width: 22px; height: 22px; border-radius: 4px;
    border: 1px solid rgba(0,0,0,.2); vertical-align: middle;
  }
  .code { font-weight: 600; }
  .hex { color: #888; font-size: 11px; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; color: #fff; }
  .de0 { background: #2f855a; }  /* < 1: отлично */
  .de1 { background: #68a63e; }  /* < 2: хорошо */
  .de2 { background: #dd8a20; }  /* < 5: заметно */
  .de3 { background: #c53030; }  /* >= 5: вне палитры */
  .tex { background: #ececea; color: #777; border: 1px solid #ddd; }
  .solid { color: #888; }

  /* Настройка столбцов */
  #colpanel {
    position: absolute; top: 100%; right: 14px; z-index: 5;
    background: #fff; border: 1px solid #ccc; border-radius: 8px;
    padding: 10px 12px; min-width: 260px; display: none;
  }
  #colpanel.open { display: block; }
  #colpanel .g { margin-bottom: 8px; }
  #colpanel .g-head { display: flex; align-items: center; gap: 6px; font-weight: 600; padding: 3px 0; }
  #colpanel .c { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 22px; }
  #colpanel .c.off, #colpanel .g.off .c { color: #999; }
  #colpanel .mv { margin-left: auto; display: flex; gap: 2px; }
  #colpanel .mv button { padding: 0 6px; line-height: 18px; font-size: 11px; border-radius: 4px; }
  #colpanel .mv button:disabled { opacity: .3; cursor: default; }
  #colpanel .foot { display: flex; gap: 8px; margin-top: 6px; padding-top: 8px; border-top: 1px solid #eee; }
  #colpanel .foot .hint { color: #888; font-size: 11px; flex: 1; }

  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #1c1c1c; color: #fff; padding: 8px 16px; border-radius: 8px;
    opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center;
  }
  #toast.on { opacity: .92; }
</style>
</head>

  <header>
    <label class="opt"><input type="checkbox" id="checkAll" checked> <span data-t="all">все</span></label>
    <button id="btnCopy" class="primary" data-t="btn_copy">Скопировать ТЗ (в Google Таблицы)</button>
    <button id="btnApplyRal" data-t="btn_apply_ral">Применить RAL</button>

    <label class="opt" data-t-title="tint_title" title="Перекрашивать и текстурные материалы: SketchUp затонирует текстуру в цвет палитры">
      <input type="checkbox" id="optTint"> <span data-t="tint_label">тонировать текстурные</span>
    </label>
    <span class="spacer"></span>
    <button id="btnCols" data-t="btn_cols">Столбцы ▾</button>
    <button id="btnRescan" data-t="btn_rescan">Обновить</button>
    <div id="colpanel"></div>
  </header>
  <div id="status" data-t="scanning">Считаю ближайшие RAL и NCS для материалов модели…</div>
  <div id="wrap">

      <thead>
        <tr class="grp" id="hgrp"></tr>
        <tr class="col" id="hcol"></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="toast"></div>

var T = I18N[LANG] || I18N.ru;
function t(key) { var s = T[key]; return s === undefined ? key : s; }
// tf('status', {n: 3}) — подстановка {плейсхолдеров}
function tf(key, vars) {
  return t(key).replace(/\{(\w+)\}/g, function (_, k) { return vars[k] !== undefined ? vars[k] : '{' + k + '}'; });
}
// Разметка держит русский текст как запасной; data-t / data-t-title / data-t-ph переводят на месте
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
  document.querySelectorAll('[data-t-title]').forEach(function (el) { el.title = t(el.getAttribute('data-t-title')); });
  document.querySelectorAll('[data-t-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-t-ph')); });
  var title = document.querySelector('title[data-t]');
  if (title) document.title = t(title.getAttribute('data-t'));
}

<script>
  applyLang();
  var DATA = { rows: [], solid: 0, textured: 0 };

  // ---------- Столбцы ----------
  // Экранная таблица и буфер обмена строятся из одного списка: что видно —
  // то и копируется, в том же порядке.
  var GROUPS = [
    { key: 'mat', title: t('grp_mat'), cols: [
      { key: 'name',      title: t('col_name'),  exp: t('exp_name'),      on: true },
      { key: 'type',      title: t('col_type'),  exp: t('exp_type'),      on: true },
      { key: 'color',     title: t('col_color'), exp: t('exp_color'),     on: true },
      { key: 'hex',       title: t('col_hex'),   exp: t('exp_hex_model'), on: true },
      { key: 'rgb',       title: t('col_rgb'),   exp: t('exp_rgb_model'), on: false }
    ]},
    { key: 'ral', title: 'RAL', cols: [
      { key: 'ral_color', title: t('col_color'),    exp: t('exp_color_ral'), on: true },
      { key: 'ral_code',  title: 'RAL',             exp: 'RAL',              on: true },
      { key: 'ral_name',  title: t('col_ral_name'), exp: t('exp_ral_name'),  on: true },
      { key: 'ral_hex',   title: t('col_hex'),      exp: t('exp_ral_hex'),   on: false },
      { key: 'ral_rgb',   title: t('col_rgb'),      exp: t('exp_ral_rgb'),   on: false },
      { key: 'ral_de',    title: 'ΔE',              exp: t('exp_ral_de'),    on: true }
    ]},
    { key: 'ncs', title: 'NCS', cols: [
      { key: 'ncs_color', title: t('col_color'), exp: t('exp_color_ncs'), on: true },
      { key: 'ncs_code',  title: 'NCS',          exp: 'NCS',              on: true },
      { key: 'ncs_hex',   title: t('col_hex'),   exp: t('exp_ncs_hex'),   on: false },
      { key: 'ncs_rgb',   title: t('col_rgb'),   exp: t('exp_ncs_rgb'),   on: false },
      { key: 'ncs_de',    title: 'ΔE',           exp: t('exp_ncs_de'),    on: true }
    ]}
  ];
  var COLDEF = {};
  GROUPS.forEach(function (g) { g.cols.forEach(function (c) { COLDEF[c.key] = c; }); });

  // CFG: [{key, on, cols:[{key, on}]}] — порядок групп и столбцов внутри
  var CFG = defaultCfg();

  function defaultCfg() {
    return GROUPS.map(function (g) {
      return { key: g.key, on: true, cols: g.cols.map(function (c) { return { key: c.key, on: c.on }; }) };
    });
  }

  // "mat:name,type,-rgb|-ral:ral_color,...|ncs:..." — без кавычек, чтобы
  // безопасно жить в реестре SketchUp
  function serializeCfg() {
    return CFG.map(function (g) {
      return (g.on ? '' : '-') + g.key + ':' + g.cols.map(function (c) { return (c.on ? '' : '-') + c.key; }).join(',');
    }).join('|');
  }

  function parseCfg(spec) {
    if (!spec || typeof spec !== 'string') return null;
    var byKey = {};
    GROUPS.forEach(function (g) { byKey[g.key] = g; });
    var seenG = {}, out = [];
    spec.split('|').forEach(function (part) {
      var m = part.match(/^(-?)([a-z]+):(.*)$/);
      if (!m || !byKey[m[2]] || seenG[m[2]]) return;
      seenG[m[2]] = true;
      var g = byKey[m[2]], seenC = {}, cols = [];
      m[3].split(',').forEach(function (tok) {
        var cm = tok.match(/^(-?)([a-z_]+)$/);
        if (!cm || !COLDEF[cm[2]] || seenC[cm[2]]) return;
        if (!g.cols.some(function (c) { return c.key === cm[2]; })) return;
        seenC[cm[2]] = true;
        cols.push({ key: cm[2], on: cm[1] !== '-' });
      });
      g.cols.forEach(function (c) { if (!seenC[c.key]) cols.push({ key: c.key, on: c.on }); });
      out.push({ key: g.key, on: m[1] !== '-', cols: cols });
    });
    GROUPS.forEach(function (g) {
      if (!seenG[g.key]) out.push({ key: g.key, on: true, cols: g.cols.map(function (c) { return { key: c.key, on: c.on }; }) });
    });
    return out;
  }

  function saveCfg() {
    try { sketchup.save_columns(serializeCfg()); } catch (e) {}
  }

  // Видимые столбцы в порядке показа: [{key, group}]
  function visibleCols() {
    var out = [];
    CFG.forEach(function (g) {
      if (!g.on) return;
      g.cols.forEach(function (c) { if (c.on) out.push({ key: c.key, group: g.key }); });
    });
    return out;
  }

  // ---------- Значения ячеек ----------
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
  }
  function deClass(de) { return de < 1 ? 'de0' : de < 2 ? 'de1' : de < 5 ? 'de2' : 'de3'; }
  function deTitle(de) {
    return de < 1 ? t('de_excellent') : de < 2 ? t('de_good')
         : de < 5 ? t('de_notice') : t('de_out');
  }
  // "#F0D3D0" -> "240-211-208" — формат RGB, принятый в ТЗ на фасады
  function hexToRgbStr(hex) {
    var h = hex.replace('#', '');
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16),
            parseInt(h.substr(4, 2), 16)].join('-');
  }

  // Значение для буфера: {v, bg}
  function cellValue(r, key) {
    switch (key) {
      case 'name':      return { v: r.display_name };
      case 'type':      return { v: r.textured ? t('type_tex') : t('type_solid') };
      case 'color':     return { v: '', bg: r.hex };
      case 'hex':       return { v: r.hex };
      case 'rgb':       return { v: hexToRgbStr(r.hex) };
      case 'ral_color': return { v: '', bg: r.ral.hex };
      case 'ral_code':  return { v: r.ral.code };
      case 'ral_name':  return { v: r.ral.name || '' };
      case 'ral_hex':   return { v: r.ral.hex };
      case 'ral_rgb':   return { v: hexToRgbStr(r.ral.hex) };
      case 'ral_de':    return { v: r.ral.de.toFixed(1) };
      case 'ncs_color': return { v: '', bg: r.ncs.hex };
      case 'ncs_code':  return { v: r.ncs.code };
      case 'ncs_hex':   return { v: r.ncs.hex };
      case 'ncs_rgb':   return { v: hexToRgbStr(r.ncs.hex) };
      case 'ncs_de':    return { v: r.ncs.de.toFixed(1) };
    }
    return { v: '' };
  }

  // HTML для экрана
  function cellHtml(r, key) {
    switch (key) {
      case 'name':
        return '<td class="matname" title="' + esc(r.display_name) +
               (r.textured ? esc(t('tex_avg')) : '') + '">' + esc(r.display_name) + '</td>';
      case 'type':
        return '<td>' + (r.textured ? '<span class="pill tex">' + esc(t('type_tex')) + '</span>' : '<span class="solid">' + esc(t('type_solid')) + '</span>') + '</td>';
      case 'color':     return '<td><span class="sw" style="background:' + r.hex + '"></span></td>';
      case 'ral_color': return '<td class="b-ral"><span class="sw" style="background:' + r.ral.hex + '"></span></td>';
      case 'ncs_color': return '<td class="b-ncs"><span class="sw" style="background:' + r.ncs.hex + '"></span></td>';
      case 'hex': case 'ral_hex': case 'ncs_hex':
        return '<td><span class="hex">' + cellValue(r, key).v + '</span></td>';
      case 'ral_code':  return '<td class="code">' + esc(r.ral.code) + '</td>';
      case 'ncs_code':  return '<td class="code">' + esc(r.ncs.code) + '</td>';
      case 'ral_de':
        return '<td><span class="pill ' + deClass(r.ral.de) + '" title="' + deTitle(r.ral.de) + '">' + r.ral.de.toFixed(1) + '</span></td>';
      case 'ncs_de':
        return '<td><span class="pill ' + deClass(r.ncs.de) + '" title="' + deTitle(r.ncs.de) + '">' + r.ncs.de.toFixed(1) + '</span></td>';
      default:
        return '<td>' + esc(cellValue(r, key).v) + '</td>';
    }
  }

  // ---------- Рендер таблицы ----------
  function renderTable() {
    var cols = visibleCols();
    var gtitle = {};
    GROUPS.forEach(function (g) { gtitle[g.key] = g.title; });

    // Шапка групп: одна ячейка на непрерывный блок одной группы
    var ghtml = '<th></th>', i = 0;
    while (i < cols.length) {
      var g = cols[i].group, span = 0;
      while (i + span < cols.length && cols[i + span].group === g) span++;
      ghtml += '<th class="g-' + g + '" colspan="' + span + '">' + esc(gtitle[g]) + '</th>';
      i += span;
    }
    document.getElementById('hgrp').innerHTML = ghtml;

    document.getElementById('hcol').innerHTML = '<th></th>' + cols.map(function (c, idx) {
      var first = idx === 0 || cols[idx - 1].group !== c.group;
      return '<th' + (first && c.group !== 'mat' ? ' class="b-' + c.group + '"' : '') + '>' + esc(COLDEF[c.key].title) + '</th>';
    }).join('');

    document.getElementById('rows').innerHTML = DATA.rows.map(function (r, ri) {
      return '<tr><td><input type="checkbox" class="rowcheck" data-i="' + ri + '" checked></td>' +
             cols.map(function (c) { return cellHtml(r, c.key); }).join('') + '</tr>';
    }).join('');
  }

  function renderColPanel() {
    var p = document.getElementById('colpanel');
    var gtitle = {};
    GROUPS.forEach(function (g) { gtitle[g.key] = g.title; });
    p.innerHTML = CFG.map(function (g, gi) {
      var head = '<div class="g-head">' +
        '<input type="checkbox" data-g="' + gi + '"' + (g.on ? ' checked' : '') + '> ' + esc(gtitle[g.key]) +
        '<span class="mv"><button data-mg="' + gi + '" data-d="-1"' + (gi === 0 ? ' disabled' : '') + ' title="' + esc(t('mv_up')) + '">▲</button>' +
        '<button data-mg="' + gi + '" data-d="1"' + (gi === CFG.length - 1 ? ' disabled' : '') + ' title="' + esc(t('mv_down')) + '">▼</button></span></div>';
      var cols = g.cols.map(function (c, ci) {
        return '<div class="c' + (c.on ? '' : ' off') + '">' +
          '<input type="checkbox" data-g="' + gi + '" data-c="' + ci + '"' + (c.on ? ' checked' : '') + '> ' + esc(COLDEF[c.key].exp) +
          '<span class="mv"><button data-mc="' + gi + ':' + ci + '" data-d="-1"' + (ci === 0 ? ' disabled' : '') + ' title="' + esc(t('mv_left')) + '">▲</button>' +
          '<button data-mc="' + gi + ':' + ci + '" data-d="1"' + (ci === g.cols.length - 1 ? ' disabled' : '') + ' title="' + esc(t('mv_right')) + '">▼</button></span></div>';
      }).join('');
      return '<div class="g' + (g.on ? '' : ' off') + '">' + head + cols + '</div>';
    }).join('') +
    '<div class="foot"><span class="hint">' + esc(t('cols_hint')) + '</span>' +
    '<button id="colsReset">' + esc(t('cols_reset')) + '</button></div>';
  }

  function cfgChanged() {
    renderColPanel();
    renderTable();
    saveCfg();
    updateStatus();
  }

  function updateStatus() {
    var status = tf('status', { n: DATA.rows.length, solid: DATA.solid, tex: DATA.textured });
    if (DATA.textured > 0) status += t('status_tex');
    status += tf('status_cols', { v: visibleCols().length, t: Object.keys(COLDEF).length });
    status += t('status_de');
    document.getElementById('status').textContent = status;
  }

  function init(data) {
    DATA = data;
    var parsed = parseCfg(data.columns);
    if (parsed) CFG = parsed;
    renderColPanel();
    renderTable();
    updateStatus();
    document.getElementById('checkAll').checked = true;
  }

  // ---------- Действия ----------
  function checkedRows() {
    var out = [];
    document.querySelectorAll('.rowcheck:checked').forEach(function (cb) {
      out.push(DATA.rows[parseInt(cb.dataset.i, 10)]);
    });
    return out;
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); }, 2400);
  }

  // Пустые ячейки «Цвет» в TSV держат сетку; в HTML-формате буфера те же
  // ячейки уходят с background-color — Google Таблицы и Excel сохраняют заливку.
  function buildTsv(rows, cols) {
    var lines = [cols.map(function (c) { return COLDEF[c.key].exp; }).join('\t')];
    rows.forEach(function (r) {
      lines.push(cols.map(function (c) { return cellValue(r, c.key).v; }).join('\t'));
    });
    return lines.join('\n');
  }

  function buildHtmlTable(rows, cols) {
    var head = '<tr>' + cols.map(function (c) {
      return '<td style="font-weight:bold">' + esc(COLDEF[c.key].exp) + '</td>';
    }).join('') + '</tr>';
    var body = rows.map(function (r) {
      return '<tr>' + cols.map(function (c) {
        var v = cellValue(r, c.key);
        return '<td' + (v.bg ? ' style="background-color:' + v.bg + '"' : '') + '>' + esc(v.v) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<table>' + head + body + '</table>';
  }

  function copyBoth(tsv, html, onDone) {
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = tsv;
      document.body.appendChild(ta);
      ta.select();
      function handler(e) {
        e.clipboardData.setData('text/plain', tsv);
        e.clipboardData.setData('text/html', html);
        e.preventDefault();
      }
      document.addEventListener('copy', handler);
      try { document.execCommand('copy'); } finally {
        document.removeEventListener('copy', handler);
        document.body.removeChild(ta);
      }
      onDone();
    }
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
      var item = new ClipboardItem({
        'text/plain': new Blob([tsv], { type: 'text/plain' }),
        'text/html': new Blob([html], { type: 'text/html' })
      });
      navigator.clipboard.write([item]).then(onDone, legacy);
    } else {
      legacy();
    }
  }

  function copyTz() {
    var rows = checkedRows();
    var cols = visibleCols();
    if (!rows.length) { toast(t('toast_none')); return; }
    if (!cols.length)  { toast(t('toast_nocols')); return; }
    copyBoth(buildTsv(rows, cols), buildHtmlTable(rows, cols), function () {
      toast(tf('toast_copied', { r: rows.length, c: cols.length }));
    });
  }

  function apply(palette) {
    var rows = checkedRows();
    if (!rows.length) { toast(t('toast_none')); return; }
    var tint = document.getElementById('optTint').checked;
    var solid = rows.filter(function (r) { return !r.textured; });
    var textured = rows.length - solid.length;
    var target = tint ? rows : solid;
    if (!target.length) {
      toast(t('toast_only_tex'));
      return;
    }
    var label = palette.toUpperCase();
    var msg = tf('confirm_apply', { n: target.length, p: label });
    if (textured > 0) {
      msg += tint ? tf('confirm_tint', { n: textured, p: label }) : tf('confirm_notint', { n: textured });
    }
    msg += t('confirm_undo');
    if (!confirm(msg)) return;
    sketchup.apply(JSON.stringify({
      palette: palette,
      tint: tint,
      names: target.map(function (r) { return r.name; })
    }));
  }

  // ---------- События ----------
  document.getElementById('btnCopy').addEventListener('click', copyTz);
  document.getElementById('btnApplyRal').addEventListener('click', function () { apply('ral'); });
  document.getElementById('btnApplyNcs').addEventListener('click', function () { apply('ncs'); });
  document.getElementById('btnRescan').addEventListener('click', function () {
    document.getElementById('status').textContent = t('scanning');
    sketchup.rescan();
  });
  document.getElementById('checkAll').addEventListener('change', function (e) {
    document.querySelectorAll('.rowcheck').forEach(function (cb) { cb.checked = e.target.checked; });
  });

  var colBtn = document.getElementById('btnCols');
  var colPanel = document.getElementById('colpanel');
  colBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    colPanel.classList.toggle('open');
    colBtn.classList.toggle('on', colPanel.classList.contains('open'));
  });
  document.addEventListener('click', function (e) {
    if (colPanel.classList.contains('open') && !colPanel.contains(e.target)) {
      colPanel.classList.remove('open');
      colBtn.classList.remove('on');
    }
  });
  colPanel.addEventListener('change', function (e) {
    var t = e.target;
    if (t.tagName !== 'INPUT') return;
    var g = CFG[parseInt(t.dataset.g, 10)];
    if (t.dataset.c !== undefined) g.cols[parseInt(t.dataset.c, 10)].on = t.checked;
    else g.on = t.checked;
    cfgChanged();
  });
  colPanel.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'colsReset') { CFG = defaultCfg(); cfgChanged(); return; }
    var d = parseInt(b.dataset.d, 10);
    if (b.dataset.mg !== undefined) {
      var gi = parseInt(b.dataset.mg, 10), gj = gi + d;
      if (gj < 0 || gj >= CFG.length) return;
      var tmp = CFG[gi]; CFG[gi] = CFG[gj]; CFG[gj] = tmp;
      cfgChanged();
    } else if (b.dataset.mc !== undefined) {
      var p = b.dataset.mc.split(':'), grp = CFG[parseInt(p[0], 10)];
      var ci = parseInt(p[1], 10), cj = ci + d;
      if (cj < 0 || cj >= grp.cols.length) return;
      var tc = grp.cols[ci]; grp.cols[ci] = grp.cols[cj]; grp.cols[cj] = tc;
      cfgChanged();
    }
  });

  window.addEventListener('DOMContentLoaded', function () { var s=document.createElement('script'); s.src='fan_data.js'; s.onload=function(){ var c=document.createElement('script'); c.src='colormatch.js'; document.body.appendChild(c); }; document.body.appendChild(s); });
</script>
</body>
